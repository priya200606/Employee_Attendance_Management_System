<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        .header {
            background: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        .logout {
            display: inline-block;
            padding: 12px 25px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Employee Dashboard</h1>
</div>

<div class="container">

    <div class="card">
        <h2>Welcome Employee</h2>

        <p>You have successfully logged in.</p>

        <a href="/logout" class="logout">Logout</a>
    </div>

</div>

</body>
</html>
