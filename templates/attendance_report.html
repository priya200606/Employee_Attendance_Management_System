<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.container{
    margin-top:40px;
}

.card{
    border-radius:15px;
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:20px;
}

</style>

</head>


<body>


<div class="container">


<div class="card shadow">


<div class="card-body">


<h2>📊 Attendance Report</h2>


<table class="table table-bordered">


<thead class="table-primary">

<tr>

<th>ID</th>
<th>Employee ID</th>
<th>Date</th>
<th>Status</th>

</tr>

</thead>


<tbody>


{% for row in attendance %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

</tr>


{% endfor %}


</tbody>


</table>


<a href="/dashboard" class="btn btn-secondary w-100">
Back to Dashboard
</a>


</div>


</div>


</div>


</body>

</html>
