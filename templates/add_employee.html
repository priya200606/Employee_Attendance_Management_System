<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#084298;
        }

        a{
            text-decoration:none;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#0d6efd;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Add Employee</h2>

    <form method="POST">

        <input type="text" name="employee_id" placeholder="Employee ID" required>

        <input type="text" name="name" placeholder="Employee Name" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="text" name="department" placeholder="Department" required>

        <input type="text" name="mobile" placeholder="Mobile Number" required>

        <button type="submit">Save Employee</button>

    </form>

    <a href="/login" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
