<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#0d6efd;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;

        }

        .login-box{

            width:400px;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);

        }

        h1{

            text-align:center;
            margin-bottom:30px;
            color:#0d6efd;

        }

        label{

            font-weight:bold;

        }

        input{

            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:20px;
            border:1px solid gray;
            border-radius:5px;

        }

        button{

            width:100%;
            padding:12px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;

        }

        button:hover{

            background:#084298;

        }

        p{

            text-align:center;
            margin-top:20px;

        }

    </style>

</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<form action="/login" method="POST">

<label>Username</label>

<input type="text" name="username" placeholder="Enter Username">

<label>Password</label>

<input type="password" name="password" placeholder="Enter Password">

<button type="submit">Login</button>

</form>

<p>Employee Attendance Management System</p>

</div>

</body>

</html>
