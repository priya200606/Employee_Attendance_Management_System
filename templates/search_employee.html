<!DOCTYPE html>
<html lang="en">

<head>

<title>Search Employee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<div class="card shadow">


<div class="card-body">


<h2 class="text-center text-primary">
🔍 Search Employee
</h2>


<form method="POST">


<input type="text"
name="employee_id"
class="form-control"
placeholder="Enter Employee ID"
required>


<br>


<button class="btn btn-primary w-100">
Search
</button>


</form>


<hr>


{% if employees %}


<table class="table table-bordered">


<tr>
<th>ID</th>
<th>Employee ID</th>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Mobile</th>
</tr>


{% for emp in employees %}

<tr>

<td>{{emp[0]}}</td>
<td>{{emp[1]}}</td>
<td>{{emp[2]}}</td>
<td>{{emp[3]}}</td>
<td>{{emp[4]}}</td>
<td>{{emp[5]}}</td>

</tr>

{% endfor %}


</table>


{% endif %}


<a href="/dashboard" class="btn btn-secondary w-100">
⬅ Back
</a>


</div>


</div>


</div>


</body>

</html>
