<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mark Attendance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.container{
    max-width:600px;
    margin-top:40px;
}

.card{
    border-radius:15px;
}

h2{
    color:#0d6efd;
    text-align:center;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow">

<div class="card-body">

<h2>📅 Mark Attendance</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Employee
</label>

<select class="form-select" name="employee_id" required>

<option value="">
Select Employee
</option>

{% for emp in employees %}

<option value="{{ emp[0] }}">
{{ emp[0] }} - {{ emp[1] }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">
Date
</label>

<input
type="date"
class="form-control"
name="date"
required>

</div>

<div class="mb-3">

<label class="form-label">
Attendance Status
</label>

<select class="form-select" name="status" required>

<option value="Present">Present</option>

<option value="Absent">Absent</option>

<option value="Leave">Leave</option>

</select>

</div>

<button class="btn btn-success w-100">
Save Attendance
</button>

</form>

<br>

<a href="/login" class="btn btn-secondary w-100">
⬅ Back to Dashboard
</a>

</div>

</div>

</div>

</body>
</html>
